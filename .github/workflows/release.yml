name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.0, để trống nếu chỉ test build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build Steam Bypass (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --release

      - name: Build release binary
        run: cargo build --release

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item target\release\steam_bypass.exe -Destination dist\
          Copy-Item README.md -Destination dist\
          Copy-Item LICENSE -Destination dist\
          Compress-Archive -Path dist\* -DestinationPath steam_bypass-windows-x64.zip -Force

      - name: Upload artifact (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: steam_bypass-windows-x64
          path: |
            target/release/steam_bypass.exe
            steam_bypass-windows-x64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          name: Steam Bypass ${{ github.ref_name || github.event.inputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            target/release/steam_bypass.exe
            steam_bypass-windows-x64.zip
